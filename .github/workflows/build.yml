name: Build

on:
  push:
    branches:
      - main
      - feat/lockscreen-studio-mvp
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LockscreenStudio.sln

      - name: Build
        run: dotnet build LockscreenStudio.sln --configuration Release --no-restore
